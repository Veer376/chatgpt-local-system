<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local System Workspace</title>
  <link rel="stylesheet" href="ui-foundation.css">
  <link rel="stylesheet" href="side-panel.css">
  <script src="thread-route.js" defer></script>
  <script src="shared-runtime.js" defer></script>
  <script src="side-panel.js" defer></script>
</head>
<body>
  <main id="side-panel" class="side-panel">
    <div id="workspace-empty" class="workspace-empty">
      <div id="workspace-skeleton" class="workspace-skeleton" aria-hidden="true">
        <div class="workspace-skeleton__top"><span></span><span></span><span></span></div>
        <div class="workspace-skeleton__body">
          <div class="workspace-skeleton__sidebar">
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <div class="workspace-skeleton__editor">
            <b></b><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
      </div>
      <div id="workspace-empty-card" class="workspace-empty__card" hidden>
        <div id="workspace-empty-title" class="workspace-empty__title"></div>
        <div id="workspace-empty-copy" class="workspace-empty__copy"></div>
        <div class="workspace-empty__actions">
          <button id="choose-project" class="primary-button" type="button" hidden>Choose project</button>
          <button id="retry-connection" class="secondary-button" type="button" hidden>Retry connection</button>
        </div>
      </div>
    </div>

    <iframe id="workspace-frame" class="workspace-frame" title="Local System workspace" allow="clipboard-write"></iframe>

    <div id="project-picker" class="project-picker" hidden>
      <button class="picker-backdrop ls-ui-backdrop" type="button" aria-label="Close project picker"></button>
      <section class="picker-card ls-ui-dialog-surface" role="dialog" aria-modal="true" aria-label="Projects">
        <div class="project-search-bar">
          <input id="project-search" class="project-search ls-ui-search-field" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search projects" aria-label="Search projects">
          <button id="close-project-picker" class="icon-button picker-close ls-ui-icon-button" type="button" aria-label="Close project picker">×</button>
        </div>
        <label class="project-picker-option">
          <span>Include hidden folders</span>
          <input id="project-include-hidden" type="checkbox">
          <span class="project-picker-option__switch" aria-hidden="true"></span>
        </label>
        <div id="project-list" class="project-list ls-ui-scroll"></div>
      </section>
    </div>

    <div id="quick-open-host" class="quick-open-host" hidden>
      <button class="picker-backdrop ls-ui-backdrop" type="button" aria-label="Close quick open"></button>
      <iframe id="quick-open-frame" class="quick-open-frame" title="Quick open"></iframe>
    </div>
  </main>
</body>
</html>
