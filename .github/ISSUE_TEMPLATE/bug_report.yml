name: Bug report
description: Report reproducible behavior in Local System
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Do not paste secrets, private project content, tunnel credentials, device IDs, or unsanitized personal logs.** Security vulnerabilities belong in GitHub private vulnerability reporting, not this form.
  - type: input
    id: version
    attributes:
      label: Local System version or commit
      description: Run `git rev-parse --short HEAD` if you are using a source checkout.
      placeholder: d0ea1aa
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v20.x or v22.x
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection path
      options:
        - OpenAI Secure MCP Tunnel
        - Advanced authenticated ngrok/HTTPS gateway
        - Direct local MCP client
        - Not sure / not connected yet
    validations:
      required: true
  - type: dropdown
    id: extension
    attributes:
      label: Chrome extension enabled?
      options:
        - "Yes"
        - "No"
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a minimal/sample project when possible.
      placeholder: |
        1. Start Local System with ...
        2. In ChatGPT ...
        3. Run ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized diagnostics
      description: If relevant, paste `npm run doctor -- --json` after removing unnecessary personal paths. The doctor redacts configured secrets, but review output before posting.
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, private project content, personal identifiers, and sensitive logs from this report.
          required: true
