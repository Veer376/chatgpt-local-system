<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Local System feature map</title>
  <desc id="desc">Four visual panels showing composer skill and file attachment, project workspace, previews and annotations, and local execution with approvals.</desc>
  <rect width="1200" height="860" rx="34" fill="#0b0f14"/>
  <rect x="1" y="1" width="1198" height="858" rx="33" fill="none" stroke="#263140" stroke-width="2"/>

  <text x="48" y="62" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="31" font-weight="700">What Local System adds to ChatGPT</text>
  <text x="48" y="94" fill="#8d9bab" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Context in the composer · project workspace · rich feedback · local execution</text>

  <!-- Composer -->
  <rect x="48" y="132" width="538" height="314" rx="24" fill="#111821" stroke="#293544"/>
  <circle cx="82" cy="169" r="16" fill="#251a38" stroke="#7d5bab"/>
  <path d="M75 169h14M82 162v14" stroke="#c9a8ff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="112" y="176" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="700">Attach context while you type</text>
  <text x="78" y="207" fill="#8d9bab" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Search local skills and project files inside the ChatGPT composer.</text>
  <rect x="78" y="231" width="478" height="76" rx="18" fill="#161f2a" stroke="#2e3b4b"/>
  <rect x="96" y="250" width="178" height="38" rx="11" fill="#21172f" stroke="#604681"/>
  <text x="111" y="275" fill="#d9bcff" font-family="SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">// code-review</text>
  <rect x="287" y="250" width="204" height="38" rx="11" fill="#102333" stroke="#315a80"/>
  <text x="302" y="275" fill="#a9d6ff" font-family="SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">@@ src/server.js</text>
  <circle cx="525" cy="269" r="15" fill="#1c6b3a"/>
  <path d="M518 269l5 5 9-11" fill="none" stroke="#c8f7d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="78" y="326" width="218" height="91" rx="15" fill="#151c25" stroke="#293544"/>
  <path d="M101 349l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="none" stroke="#bc8cff" stroke-width="2"/>
  <text x="126" y="361" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">// Skills</text>
  <text x="98" y="388" fill="#8d9bab" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">skill chip + SKILL.md</text>
  <rect x="312" y="326" width="244" height="91" rx="15" fill="#151c25" stroke="#293544"/>
  <path d="M334 345h18l8 8v28h-26z" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <path d="M352 345v9h8" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="374" y="361" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">@@ Files</text>
  <text x="334" y="388" fill="#8d9bab" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">actual file attachment</text>

  <!-- Workspace -->
  <rect x="614" y="132" width="538" height="314" rx="24" fill="#111821" stroke="#293544"/>
  <circle cx="648" cy="169" r="16" fill="#122537" stroke="#315a80"/>
  <path d="M638 162h13l5 5h15v14h-33z" fill="none" stroke="#8ac7ff" stroke-width="2"/>
  <text x="678" y="176" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="700">Project workspace beside the chat</text>
  <rect x="644" y="211" width="154" height="203" rx="14" fill="#0f151d" stroke="#293544"/>
  <text x="660" y="238" fill="#8d9bab" font-family="SFMono-Regular,Menlo,monospace" font-size="12">▾ src</text>
  <rect x="655" y="251" width="128" height="31" rx="8" fill="#17273a"/>
  <circle cx="671" cy="267" r="3.5" fill="#58a6ff"/>
  <text x="683" y="271" fill="#f4f7fb" font-family="SFMono-Regular,Menlo,monospace" font-size="12">server.js</text>
  <text x="671" y="305" fill="#8d9bab" font-family="SFMono-Regular,Menlo,monospace" font-size="12">config.js</text>
  <text x="671" y="332" fill="#8d9bab" font-family="SFMono-Regular,Menlo,monospace" font-size="12">routes.js</text>
  <text x="660" y="370" fill="#8d9bab" font-family="SFMono-Regular,Menlo,monospace" font-size="12">▸ tests</text>
  <rect x="812" y="211" width="310" height="203" rx="14" fill="#151d27" stroke="#293544"/>
  <rect x="828" y="228" width="86" height="27" rx="8" fill="#102333" stroke="#315a80"/>
  <text x="840" y="246" fill="#a9d6ff" font-family="SFMono-Regular,Menlo,monospace" font-size="11">server.js</text>
  <text x="832" y="284" fill="#bc8cff" font-family="SFMono-Regular,Menlo,monospace" font-size="12">export</text>
  <text x="879" y="284" fill="#58a6ff" font-family="SFMono-Regular,Menlo,monospace" font-size="12">async function</text>
  <text x="990" y="284" fill="#f4f7fb" font-family="SFMono-Regular,Menlo,monospace" font-size="12">start()</text>
  <text x="848" y="312" fill="#8d9bab" font-family="SFMono-Regular,Menlo,monospace" font-size="12">await app.listen(PORT)</text>
  <rect x="831" y="344" width="273" height="48" rx="10" fill="#102333" stroke="#315a80"/>
  <text x="846" y="363" fill="#8d9bab" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">ChatGPT mentioned</text>
  <text x="936" y="363" fill="#58a6ff" font-family="SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700">src/server.js</text>
  <text x="846" y="382" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">click → open the actual local file</text>

  <!-- Preview + annotations -->
  <rect x="48" y="478" width="538" height="314" rx="24" fill="#111821" stroke="#293544"/>
  <circle cx="82" cy="515" r="16" fill="#2b2112" stroke="#725d2b"/>
  <path d="M72 520l9-10 7 6 8-9 10 13z" fill="none" stroke="#e3c56b" stroke-width="2"/>
  <text x="112" y="522" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="700">Preview it. Annotate it. Send it back.</text>
  <rect x="78" y="553" width="304" height="201" rx="14" fill="#0f151d" stroke="#293544"/>
  <rect x="95" y="570" width="270" height="132" rx="10" fill="#17222d"/>
  <circle cx="230" cy="636" r="29" fill="#0b0f14" opacity=".76"/>
  <path d="M221 620l22 16-22 16z" fill="#f4f7fb"/>
  <rect x="101" y="715" width="254" height="5" rx="2.5" fill="#293544"/>
  <rect x="101" y="715" width="138" height="5" rx="2.5" fill="#58a6ff"/>
  <circle cx="239" cy="717.5" r="6" fill="#58a6ff"/>
  <rect x="402" y="553" width="154" height="92" rx="14" fill="#151c25" stroke="#293544"/>
  <text x="420" y="578" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700">01:42</text>
  <text x="420" y="602" fill="#d9bcff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">tighten this cut</text>
  <text x="420" y="626" fill="#8d9bab" font-family="SFMono-Regular,Menlo,monospace" font-size="10">[Annotations]</text>
  <rect x="402" y="662" width="154" height="92" rx="14" fill="#151c25" stroke="#293544"/>
  <text x="420" y="687" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">Rich preview</text>
  <text x="420" y="710" fill="#8d9bab" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">image · PDF · video</text>
  <text x="420" y="730" fill="#8d9bab" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">Markdown · HTML</text>

  <!-- Execution -->
  <rect x="614" y="478" width="538" height="314" rx="24" fill="#111821" stroke="#293544"/>
  <circle cx="648" cy="515" r="16" fill="#14291c" stroke="#2f7142"/>
  <rect x="638" y="506" width="20" height="16" rx="3" fill="none" stroke="#7ee787" stroke-width="2"/>
  <path d="M643 511l4 3-4 3M650 518h4" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round"/>
  <text x="678" y="522" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="700">Run local work. Keep approval in the loop.</text>
  <rect x="644" y="553" width="288" height="201" rx="14" fill="#0f151d" stroke="#293544"/>
  <text x="664" y="582" fill="#7ee787" font-family="SFMono-Regular,Menlo,monospace" font-size="13">$ npm test</text>
  <text x="664" y="615" fill="#8d9bab" font-family="SFMono-Regular,Menlo,monospace" font-size="12">✓ unit tests</text>
  <text x="664" y="644" fill="#8d9bab" font-family="SFMono-Regular,Menlo,monospace" font-size="12">✓ integration tests</text>
  <text x="664" y="673" fill="#d29922" font-family="SFMono-Regular,Menlo,monospace" font-size="12">… browser suite running</text>
  <rect x="664" y="704" width="246" height="32" rx="9" fill="#151c25"/>
  <circle cx="681" cy="720" r="5" fill="#d29922"/>
  <text x="695" y="724" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">managed task · keep chatting</text>
  <rect x="950" y="553" width="172" height="201" rx="14" fill="#151c25" stroke="#293544"/>
  <path d="M1036 575l27 10v22c0 26-14 42-27 50-13-8-27-24-27-50v-22z" fill="#102333" stroke="#58a6ff" stroke-width="2"/>
  <path d="M1024 609l9 9 17-20" fill="none" stroke="#7ee787" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="975" y="685" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">Approval required</text>
  <rect x="974" y="702" width="62" height="30" rx="8" fill="#14301e" stroke="#2f7142"/>
  <text x="989" y="722" fill="#7ee787" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="700">Approve</text>
  <rect x="1043" y="702" width="54" height="30" rx="8" fill="#2c1719" stroke="#74383d"/>
  <text x="1058" y="722" fill="#ff7b72" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="700">Deny</text>

  <text x="48" y="830" fill="#667483" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Illustrative feature map — not a screenshot. Actual UI follows the ChatGPT page and Chrome side-panel environment.</text>
</svg>
