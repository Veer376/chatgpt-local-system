<text x="633" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" fill="#F2F5E9" letter-spacing="-0.7">Preview. Annotate. Iterate.</text>
