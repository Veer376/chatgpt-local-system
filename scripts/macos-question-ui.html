<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob: local-system-media:; media-src data: blob: local-system-media:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
<style>
:root {
  --ls-ui-radius-button: 14px;
  color-scheme: light dark;
  --surface: #fff;
  --surface-subtle: #f7f7f8;
  --surface-hover: rgba(0,0,0,.045);
  --surface-selected: rgba(0,0,0,.065);
  --text: #181818;
  --text-soft: rgba(24,24,24,.62);
  --text-faint: rgba(24,24,24,.4);
  --border: rgba(0,0,0,.10);
  --border-strong: rgba(0,0,0,.16);
  --danger: #c43b3b;
  --shadow: 0 16px 60px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #212121;
    --surface-subtle: #2a2a2a;
    --surface-hover: rgba(255,255,255,.055);
    --surface-selected: rgba(255,255,255,.085);
    --text: #f3f3f3;
    --text-soft: rgba(243,243,243,.65);
    --text-faint: rgba(243,243,243,.42);
    --border: rgba(255,255,255,.11);
    --border-strong: rgba(255,255,255,.18);
    --danger: #ff7070;
    --shadow: 0 16px 60px rgba(0,0,0,.34), 0 2px 8px rgba(0,0,0,.18);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--surface); color: var(--text); }
html.compact-mode,
body.compact-mode { height: auto; min-height: 0; overflow: hidden; }
body {
  padding: 0;
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: text;
}
button, textarea, input { font: inherit; }
button { -webkit-user-select: none; user-select: none; }
.card {
  width: 100%;
  overflow: hidden;
  border: 0;
  border-radius: 0;
  background: var(--surface);
  box-shadow: none;
}
.compact-card {
  width: 100%;
  height: auto;
  min-height: 0;
  overflow: hidden;
  padding: 14px 15px 13px;
  background: var(--surface);
  cursor: default;
  transition: background 120ms ease;
}
.compact-card:hover { background: var(--surface-subtle); }
.compact-top {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.compact-mark {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
  border-radius: 8px;
  background: var(--surface-subtle);
  color: var(--text);
  font-size: 13px;
  font-weight: 650;
}
.compact-title { color: var(--text); font-size: 13px; font-weight: 600; }
.pending-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--surface-subtle);
  color: var(--text-soft);
  font-size: 11px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.pending-badge[hidden] { display: none; }
.compact-timer { margin-left: auto; color: var(--text-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.compact-timer[data-urgency="warning"] { color: #b7791f; }
.compact-timer[data-urgency="critical"] { color: var(--danger); font-weight: 600; }
.compact-message {
  display: -webkit-box;
  margin: 8px 0 10px 32px;
  overflow: hidden;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  color: var(--text-soft);
  font-size: 13px;
  line-height: 1.35;
}
.head {
  display: flex;
  align-items: center;
  min-height: 52px;
  padding: 9px 16px 7px;
  gap: 9px;
  color: var(--text-soft);
  font-size: 13px;
  font-weight: 500;
}
.head-icon {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
  border: 1px solid color-mix(in srgb, var(--text) 42%, transparent);
  border-radius: 999px;
  color: var(--text);
  font-weight: 600;
}
.head-title { color: var(--text-soft); }
.spacer { flex: 1; }
.timer, .position { white-space: nowrap; font-variant-numeric: tabular-nums; }
.timer[data-urgency="warning"] { color: #b7791f; }
.timer[data-urgency="critical"] { color: var(--danger); font-weight: 600; }
.icon-button {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--text-soft);
  cursor: default;
}
.icon-button:hover { background: var(--surface-hover); color: var(--text); }
.icon-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.body { padding: 8px 24px 5px; }
.question {
  margin: 0 0 16px;
  color: var(--text);
  font-size: 16px;
  font-weight: 500;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  cursor: text;
}
.rich {
  margin: 0 0 14px;
  border: 0;
  border-radius: 0;
  background: transparent;
}
.rich-zoom-controls {
  display: inline-flex;
  align-items: center;
  gap: 1px;
}
.rich-zoom-button,
.rich-zoom-label {
  display: grid;
  place-items: center;
  height: 26px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text-soft);
  cursor: default;
}
.rich-zoom-button { width: 28px; font-size: 18px; line-height: 1; }
.rich-zoom-label { min-width: 44px; padding: 0 5px; font-size: 11px; font-variant-numeric: tabular-nums; }
.rich-zoom-button:hover,
.rich-zoom-label:hover { background: var(--surface-hover); color: var(--text); }
.rich-zoom-button:disabled { opacity: .3; background: transparent; }
.rich-viewport { width: 100%; max-height: min(460px, 52vh); overflow-x: auto; overflow-y: auto; scrollbar-width: thin; }
.rich-stage { position: relative; width: 100%; min-height: 1px; }
.rich iframe { display: block; width: 100%; height: 160px; border: 0; background: transparent; transform-origin: 0 0; }
.sections { display: grid; gap: 9px; margin: 0 0 15px; }
.section { min-width: 0; }
.section-head { display: flex; align-items: center; margin-bottom: 4px; gap: 6px; }
.section-label { color: var(--text-soft); font-size: 12px; font-weight: 600; }
.section-copy {
  margin-left: auto;
  padding: 2px 6px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--text-faint);
  font-size: 11px;
  cursor: default;
}
.section-copy:hover { background: var(--surface-hover); color: var(--text); }
.section-value {
  max-height: 190px;
  overflow: auto;
  padding: 9px 11px;
  border-radius: 10px;
  background: var(--surface-subtle);
  color: var(--text);
  font-size: 13px;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  cursor: text;
}
.section-value.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.options { display: grid; gap: 4px; margin-bottom: 4px; }
.option {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  align-items: center;
  gap: 9px;
  width: 100%;
  min-height: 43px;
  padding: 3px 6px 3px 0;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: default;
}
.option:hover { background: var(--surface-hover); }
.option[aria-pressed="true"] { background: var(--surface-selected); }
.option-number {
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  margin-left: 1px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: color-mix(in srgb, var(--text) 3.5%, transparent);
  color: var(--text-soft);
  font-size: 13px;
  font-weight: 500;
}
.option[aria-pressed="true"] .option-number { background: var(--text); color: var(--surface); }
.option-text { font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.response {
  position: relative;
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr);
  align-items: start;
  margin-top: 9px;
  padding: 11px 38px 0 0;
  border-top: 1px solid color-mix(in srgb, var(--text) 8%, transparent);
  cursor: text;
}
.response-icon {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  margin-top: 1px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  color: var(--text-soft);
  pointer-events: none;
}
.response-icon svg, .attach svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.response textarea {
  width: 100%;
  min-height: 35px;
  max-height: 130px;
  resize: none;
  overflow: auto;
  padding: 5px 2px 4px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: 400 15px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.response textarea::placeholder { color: var(--text-faint); }
.attach {
  position: absolute;
  top: 4px;
  right: 0;
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--text-soft);
  cursor: default;
}
.attach:hover { background: var(--surface-hover); color: var(--text); }
.attachments { display: flex; flex-wrap: wrap; gap: 7px; margin: 9px 0 0 36px; }
.attachment {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) 22px;
  align-items: center;
  gap: 7px;
  max-width: 260px;
  min-height: 38px;
  padding: 4px 5px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-subtle);
  font-size: 12px;
}
.attachment img { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; background: #0001; }
.attachment-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment-remove {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--text-soft);
  font-size: 18px;
  line-height: 1;
  cursor: default;
}
.attachment-remove:hover { background: var(--surface-hover); color: var(--text); }
.drop-active .card { outline: 2px solid color-mix(in srgb, var(--text) 35%, transparent); outline-offset: -3px; }
.error { margin: 8px 0 0 36px; color: var(--danger); font-size: 12px; line-height: 1.35; }
.actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 9px 24px 15px; }
.button {
  min-width: 72px;
  height: 36px;
  padding: 0 15px;
  border: 1px solid var(--border);
  border-radius: var(--ls-ui-radius-button);
  background: transparent;
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  cursor: default;
}
.button:hover { background: var(--surface-hover); }
.button.primary { border-color: var(--text); background: var(--text); color: var(--surface); }
.button.primary:hover { opacity: .9; }
.button.danger { color: var(--danger); }
.button:disabled { opacity: .34; }
.waiting {
  display: grid;
  place-items: center;
  min-height: 180px;
  color: var(--text-soft);
  font-size: 14px;
}
</style>
</head>
<body>
<main id="root"><div class="waiting">Waiting for the agent…</div></main>
<script>
(() => {
  const root = document.getElementById('root');
  let request = null;
  let selected = new Set();
  let attachments = [];
  let countdown = 0;
  let compactMode = true;

  function native(action, payload = {}) {
    try { window.webkit.messageHandlers.native.postMessage({ action, ...payload }); } catch {}
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function iconButton(label, svg, action) {
    const button = el('button', 'icon-button');
    button.type = 'button';
    button.title = label;
    button.setAttribute('aria-label', label);
    button.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${svg}</svg>`;
    button.addEventListener('click', action);
    return button;
  }

  function pendingBadge() {
    const badge = el('span', 'pending-badge');
    badge.dataset.pendingBadge = 'true';
    updatePendingBadge(badge, request?.pendingCount);
    return badge;
  }

  function updatePendingBadge(badge, value) {
    const count = Math.max(1, Number(value) || 1);
    badge.textContent = String(count);
    badge.hidden = count <= 1;
    badge.setAttribute('aria-label', `${count} pending requests`);
  }

  function updatePendingBadges(value) {
    document.querySelectorAll('[data-pending-badge]').forEach((badge) => updatePendingBadge(badge, value));
  }

  function renderCompact() {
    document.documentElement.classList.add('compact-mode');
    document.body.classList.add('compact-mode');
    root.replaceChildren();
    const card = el('section', 'compact-card');
    const top = el('div', 'compact-top');
    const mark = el('span', 'compact-mark', request.kind === 'approval' ? '!' : '?');
    const title = el('span', 'compact-title', request.kind === 'approval' ? 'Agent needs approval' : 'Agent needs input');
    top.append(mark, title, pendingBadge());
    if (Number.isFinite(Number(request.expiresAt)) && Number(request.expiresAt) > 0) {
      const timer = el('span', 'compact-timer');
      top.append(timer);
      startCountdown(timer, Number(request.expiresAt));
    }
    card.append(top);

    const preview = request.kind === 'approval' && request.prompt
      ? request.prompt
      : request.question || 'The agent is waiting for you.';
    card.append(el('p', 'compact-message', preview));
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', 'Open Local System request');
    card.addEventListener('click', () => native('expand'));
    root.append(card);
  }

  function render() {
    if (!request) {
      document.documentElement.classList.remove('compact-mode');
      document.body.classList.remove('compact-mode');
      root.innerHTML = '<div class="waiting">Waiting for the agent…</div>';
      reportHeight();
      return;
    }
    if (compactMode) {
      renderCompact();
      return;
    }
    document.documentElement.classList.remove('compact-mode');
    document.body.classList.remove('compact-mode');
    selected = new Set();
    attachments = [];
    root.replaceChildren();

    const card = el('section', 'card');
    const head = el('header', 'head');
    const headIcon = el('span', 'head-icon', request.kind === 'approval' ? '!' : '?');
    const headTitle = el('span', 'head-title', request.kind === 'approval' ? 'Approval' : 'Question');
    head.append(headIcon, headTitle, pendingBadge(), el('span', 'spacer'));

    if (Number.isFinite(Number(request.expiresAt)) && Number(request.expiresAt) > 0) {
      const timer = el('span', 'timer');
      head.append(timer);
      startCountdown(timer, Number(request.expiresAt));
    }
    if (request.kind !== 'approval' && Number(request.questionCount) > 1) {
      head.append(el('span', 'position', `${Number(request.questionIndex) + 1} of ${request.questionCount}`));
    }
    const richPresentation = request.content ? renderRichContent(request.content) : null;
    if (richPresentation) head.append(richPresentation.controls);
    head.append(iconButton('Copy request', '<path d="M9 8h10v11H9z"/><path d="M5 15H4V4h10v1"/>', () => native('copy', { text: copyText() })));
    card.append(head);

    const body = el('div', 'body');
    if (richPresentation) body.append(richPresentation.content);
    if (!request.presentationOnly && !request.contentOnly) {
      const visibleQuestion = request.kind === 'approval' && request.prompt ? request.prompt : request.question;
      body.append(el('p', 'question', visibleQuestion));
    }
    if (Array.isArray(request.sections) && request.sections.length) body.append(renderSections(request.sections));

    const optionRoot = el('div', 'options');
    const visibleOptions = request.kind === 'approval' || request.contentOnly ? [] : (request.options || []);
    for (const [index, option] of visibleOptions.entries()) {
      const button = el('button', 'option');
      button.type = 'button';
      button.dataset.value = option;
      button.dataset.index = String(index);
      button.setAttribute('aria-pressed', 'false');
      button.append(el('span', 'option-number', String(index + 1)), el('span', 'option-text', option));
      button.addEventListener('click', () => {
        if (request.multiple) {
          if (selected.has(option)) selected.delete(option); else selected.add(option);
        } else {
          selected.clear();
          selected.add(option);
          const input = document.getElementById('response-input');
          if (input) input.value = '';
        }
        syncOptions();
        updateSubmit();
      });
      optionRoot.append(button);
    }
    if (visibleOptions.length) body.append(optionRoot);

    let input = null;
    let attachmentRoot = null;
    if (!request.presentationOnly && (request.kind === 'question' || request.allowCustom !== false)) {
      const response = el('div', 'response');
      const responseIcon = el('span', 'response-icon');
      responseIcon.innerHTML = '<svg viewBox="0 0 24 24"><path d="m4 20 4.5-1L19 8.5a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z"/><path d="m14.5 7 3 3"/></svg>';
      input = document.createElement('textarea');
      input.id = 'response-input';
      input.rows = 1;
      input.placeholder = request.kind === 'approval' ? 'Or write a different instruction' : 'Or write your own response';
      input.addEventListener('input', () => {
        if (!request.multiple && input.value.trim()) {
          selected.clear();
          syncOptions();
        }
        autosize(input);
        updateSubmit();
      });
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          submit(false);
        }
      });
      input.addEventListener('paste', (event) => {
        const files = [...(event.clipboardData?.files || [])].filter((file) => file.type.startsWith('image/'));
        if (!files.length) return;
        event.preventDefault();
        void addImageFiles(files);
      });
      const attach = el('button', 'attach');
      attach.type = 'button';
      attach.title = 'Attach image';
      attach.setAttribute('aria-label', 'Attach image');
      attach.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 12.5 14.5 7a3 3 0 1 1 4.2 4.2l-7.4 7.4a5 5 0 0 1-7.1-7.1l7.5-7.5"/></svg>';
      attach.addEventListener('click', () => native('chooseImages'));
      response.append(responseIcon, input, attach);
      response.addEventListener('click', (event) => {
        if (event.target.closest('button')) return;
        input.focus({ preventScroll: true });
      });
      body.append(response);
      attachmentRoot = el('div', 'attachments');
      body.append(attachmentRoot);

      card.addEventListener('dragover', (event) => {
        const hasImage = [...(event.dataTransfer?.items || [])].some((item) => item.kind === 'file' && item.type.startsWith('image/'));
        if (!hasImage) return;
        event.preventDefault();
        document.body.classList.add('drop-active');
      });
      card.addEventListener('dragleave', (event) => {
        if (event.relatedTarget && card.contains(event.relatedTarget)) return;
        document.body.classList.remove('drop-active');
      });
      card.addEventListener('drop', (event) => {
        document.body.classList.remove('drop-active');
        const files = [...(event.dataTransfer?.files || [])].filter((file) => file.type.startsWith('image/'));
        if (!files.length) return;
        event.preventDefault();
        void addImageFiles(files);
      });
    }

    const error = el('p', 'error');
    error.id = 'error';
    error.hidden = true;
    body.append(error);
    card.append(body);

    const actions = el('footer', 'actions');
    let submitButton = null;
    if (request.kind === 'approval') {
      const deny = actionButton('Deny', 'danger', () => submitOption('Deny'));
      const approve = actionButton('Approve', 'primary', () => submitOption('Approve'));
      actions.append(deny, approve);
      submitButton = approve;
    } else if (request.presentationOnly || request.contentOnly) {
      submitButton = actionButton('Continue', 'primary', () => submit(false));
      actions.append(submitButton);
    } else {
      actions.append(actionButton('Skip', '', () => submit(true)));
      submitButton = actionButton(Number(request.questionCount) > 1 ? 'Next' : 'Submit', 'primary', () => submit(false));
      actions.append(submitButton);
    }
    submitButton.id = 'submit-button';
    card.append(actions);
    root.append(card);
    updateSubmit();
    reportHeight();
    if (input && !visibleOptions.length) setTimeout(() => input.focus(), 60);

    function syncOptions() {
      for (const row of optionRoot.querySelectorAll('.option')) row.setAttribute('aria-pressed', selected.has(row.dataset.value) ? 'true' : 'false');
    }

    function updateSubmit() {
      if (!submitButton || request.kind === 'approval') return;
      if (request.presentationOnly || request.contentOnly) {
        submitButton.disabled = false;
        reportHeight();
        return;
      }
      const custom = input?.value.trim() || '';
      submitButton.disabled = selected.size === 0 && !custom && attachments.length === 0;
      reportHeight();
    }

    async function addImageFiles(files) {
      const error = document.getElementById('error');
      error.hidden = true;
      for (const file of files.slice(0, Math.max(0, 5 - attachments.length))) {
        if (!file?.type?.startsWith('image/')) continue;
        try {
          const prepared = await prepareImage(file);
          attachments.push(prepared);
        } catch (imageError) {
          error.textContent = imageError instanceof Error ? imageError.message : String(imageError);
          error.hidden = false;
        }
      }
      renderAttachments(attachmentRoot);
      updateSubmit();
    }

    window.__localSystemAddNativeFiles = async (items) => {
      const files = [];
      for (const item of Array.isArray(items) ? items : []) {
        try {
          const blob = dataUrlToBlob(String(item.data || ''));
          files.push(new File([blob], String(item.name || 'image'), { type: String(item.mimeType || blob.type || 'image/png') }));
        } catch {}
      }
      await addImageFiles(files);
    };
  }

  function renderSections(sections) {
    const root = el('div', 'sections');
    for (const section of sections) {
      if (!section || !section.text) continue;
      const item = el('section', 'section');
      const head = el('div', 'section-head');
      head.append(el('span', 'section-label', section.label || 'Details'));
      const copy = el('button', 'section-copy', 'Copy');
      copy.type = 'button';
      copy.addEventListener('click', () => native('copy', { text: String(section.text) }));
      head.append(copy);
      item.append(head, el('div', `section-value${section.mono ? ' mono' : ''}`, String(section.text)));
      root.append(item);
    }
    return root;
  }

  function renderRichContent(content) {
    const wrapper = el('div', 'rich');
    const controls = el('span', 'rich-zoom-controls');
    const zoomOut = el('button', 'rich-zoom-button', '−');
    const zoomLabel = el('button', 'rich-zoom-label', '100%');
    const zoomIn = el('button', 'rich-zoom-button', '+');
    zoomOut.type = 'button';
    zoomIn.type = 'button';
    zoomLabel.type = 'button';
    zoomOut.title = 'Zoom out';
    zoomIn.title = 'Zoom in';
    zoomLabel.title = 'Reset zoom';
    controls.append(zoomOut, zoomLabel, zoomIn);
    const viewport = el('div', 'rich-viewport');
    const stage = el('div', 'rich-stage');
    const frame = document.createElement('iframe');
    frame.title = 'Agent presentation';
    frame.setAttribute('sandbox', 'allow-same-origin');
    frame.referrerPolicy = 'no-referrer';
    let zoom = 1;
    let baseHeight = 160;
    let contentResizeObserver = null;
    const applyZoom = (next) => {
      zoom = Math.max(.5, Math.min(2, Math.round(next * 10) / 10));
      stage.style.width = `${zoom * 100}%`;
      stage.style.height = `${Math.ceil(baseHeight * zoom)}px`;
      frame.style.width = `${100 / zoom}%`;
      frame.style.height = `${baseHeight}px`;
      frame.style.transform = `scale(${zoom})`;
      zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
      zoomOut.disabled = zoom <= .5;
      zoomIn.disabled = zoom >= 2;
      reportHeight();
    };
    const syncContentHeight = () => {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        const measured = Math.max(
          80,
          Number(doc.documentElement?.scrollHeight) || 0,
          Number(doc.body?.scrollHeight) || 0,
          Math.ceil(doc.documentElement?.getBoundingClientRect?.().height || 0),
          Math.ceil(doc.body?.getBoundingClientRect?.().height || 0),
        );
        const nextHeight = Math.min(5000, measured);
        if (Math.abs(nextHeight - baseHeight) > 2) {
          baseHeight = nextHeight;
          applyZoom(zoom);
        }
      } catch {}
    };
    zoomOut.addEventListener('click', () => applyZoom(zoom - .1));
    zoomIn.addEventListener('click', () => applyZoom(zoom + .1));
    zoomLabel.addEventListener('click', () => applyZoom(1));
    applyZoom(1);
    frame.addEventListener('load', () => {
      syncContentHeight();
      try {
        contentResizeObserver?.disconnect();
        const doc = frame.contentDocument;
        if (!doc) return;
        contentResizeObserver = new ResizeObserver(syncContentHeight);
        if (doc.documentElement) contentResizeObserver.observe(doc.documentElement);
        if (doc.body) contentResizeObserver.observe(doc.body);
      } catch {}
    });
    const source = String(content || '');
    const trimmed = source.trim();
    if (/^<!doctype\s+html/i.test(trimmed) || /^<html\b/i.test(trimmed)) {
      frame.srcdoc = source;
    } else {
      const isDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const themeClass = isDark ? 'dark' : 'light';
      const rendered = renderPresentationContent(source);
      frame.srcdoc = `<!doctype html><html class="${themeClass}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob: local-system-media:; media-src data: blob: local-system-media:; font-src data:; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'; frame-src 'none'; connect-src 'none'"><style>:root,.light{color-scheme:light;--text:#181818;--text-soft:rgba(24,24,24,.65);--border:rgba(0,0,0,.12);--code-bg:rgba(0,0,0,.06);--code-border:rgba(0,0,0,.08);--pre-bg:rgba(0,0,0,.03);--table-th:rgba(0,0,0,.04);--quote-border:rgba(0,0,0,.35);--link:#10a37f}@media (prefers-color-scheme: dark){:root{color-scheme:dark;--text:#f3f3f3;--text-soft:rgba(243,243,243,.68);--border:rgba(255,255,255,.14);--code-bg:rgba(255,255,255,.1);--code-border:rgba(255,255,255,.12);--pre-bg:rgba(255,255,255,.05);--table-th:rgba(255,255,255,.05);--quote-border:rgba(255,255,255,.35);--link:#10a37f}}.dark{color-scheme:dark;--text:#f3f3f3;--text-soft:rgba(243,243,243,.68);--border:rgba(255,255,255,.14);--code-bg:rgba(255,255,255,.1);--code-border:rgba(255,255,255,.12);--pre-bg:rgba(255,255,255,.05);--table-th:rgba(255,255,255,.05);--quote-border:rgba(255,255,255,.35);--link:#10a37f}*{box-sizing:border-box}html,body{margin:0;min-height:0;background:transparent;color:var(--text);font:14px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:visible}body{padding:0 0 4px;user-select:text;word-break:break-word}.plain{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}h1,h2,h3,h4,h5,h6{margin:1.1em 0 .4em;line-height:1.3;color:var(--text);font-weight:650}h1{font-size:1.5em;letter-spacing:-.015em}h2{font-size:1.3em;letter-spacing:-.01em}h3{font-size:1.15em}h4{font-size:1.02em}h5,h6{font-size:.92em}h1:first-child,h2:first-child,h3:first-child,h4:first-child,p:first-child{margin-top:0}p{margin:.6em 0;line-height:1.6;color:var(--text)}ul,ol{margin:.5em 0;padding-left:1.5em;color:var(--text)}li{margin:.25em 0;line-height:1.55;color:var(--text)}li>input[type="checkbox"]{margin:0 .4em .15em 0;vertical-align:middle}blockquote{margin:.75em 0;padding:.3em 0 .3em 14px;border-left:3px solid var(--quote-border);color:var(--text-soft)}blockquote>p:first-child{margin-top:0}blockquote>p:last-child{margin-bottom:0}code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-size:.88em;padding:.18em .38em;border-radius:5px;background:var(--code-bg);border:1px solid var(--code-border);color:var(--text)}pre{margin:.8em 0;padding:12px 14px;border-radius:8px;background:var(--pre-bg);border:1px solid var(--border);overflow-x:auto;white-space:pre}pre code{padding:0;background:transparent;border:none;font-size:.86em;white-space:inherit;color:var(--text)}.table-wrap{width:100%;overflow-x:auto;margin:.8em 0}table{width:100%;border-collapse:collapse;font-size:13px;color:var(--text)}th,td{padding:8px 12px;border:1px solid var(--border);text-align:left;color:var(--text)}th{background:var(--table-th);font-weight:600}hr{border:0;border-top:1px solid var(--border);margin:1.2em 0}a{color:var(--link);text-decoration:underline;text-underline-offset:2px}a:hover{opacity:.85}img,video,svg,canvas{max-width:100%;height:auto;border-radius:6px}.md-gap{height:.35em}button,input,textarea,select{font:inherit}</style></head><body>${rendered}</body></html>`;
    }
    stage.append(frame);
    viewport.append(stage);
    wrapper.append(viewport);
    return { content: wrapper, controls };
  }

  function renderPresentationContent(source) {
    if (!source || typeof source !== 'string') return '';
    const trimmed = source.trim();
    if (/^<!doctype\s+html/i.test(trimmed) || /^<html\b/i.test(trimmed)) {
      return source;
    }
    const lines = source.replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let inFence = false;
    let fenceLang = '';
    let fenceLines = [];
    let listType = null;
    let inTable = false;
    let tableHeader = null;
    let tableRows = [];
    let tableAligns = [];

    const closeList = () => {
      if (!listType) return;
      out.push(`</${listType}>`);
      listType = null;
    };

    const closeFence = () => {
      const code = escapeHtml(fenceLines.join('\n'));
      const langAttr = fenceLang ? ` class="language-${escapeHtml(fenceLang)}"` : '';
      out.push(`<pre><code${langAttr}>${code}</code></pre>`);
      fenceLines = [];
      fenceLang = '';
      inFence = false;
    };

    const closeTable = () => {
      if (!inTable) return;
      let html = '<div class="table-wrap"><table>';
      if (tableHeader) {
        html += '<thead><tr>';
        tableHeader.forEach((cell, idx) => {
          const align = tableAligns[idx] ? ` style="text-align:${tableAligns[idx]}"` : '';
          html += `<th${align}>${renderInline(cell.trim())}</th>`;
        });
        html += '</tr></thead>';
      }
      if (tableRows.length) {
        html += '<tbody>';
        for (const row of tableRows) {
          html += '<tr>';
          row.forEach((cell, idx) => {
            const align = tableAligns[idx] ? ` style="text-align:${tableAligns[idx]}"` : '';
            html += `<td${align}>${renderInline(cell.trim())}</td>`;
          });
          html += '</tr>';
        }
        html += '</tbody>';
      }
      html += '</table></div>';
      out.push(html);
      inTable = false;
      tableHeader = null;
      tableRows = [];
      tableAligns = [];
    };

    const isTableSeparator = (line) => /^\s*\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?\s*$/.test(line);
    const parseTableCells = (line) => {
      let clean = line.trim();
      if (clean.startsWith('|')) clean = clean.slice(1);
      if (clean.endsWith('|')) clean = clean.slice(0, -1);
      return clean.split('|');
    };
    const parseAligns = (line) => {
      const cells = parseTableCells(line);
      return cells.map((cell) => {
        const c = cell.trim();
        const left = c.startsWith(':');
        const right = c.endsWith(':');
        if (left && right) return 'center';
        if (right) return 'right';
        if (left) return 'left';
        return '';
      });
    };

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      const fenceMatch = line.match(/^\s*`{3,}\s*([^`\s]*)\s*$/);
      if (fenceMatch) {
        closeList();
        closeTable();
        if (inFence) {
          closeFence();
        } else {
          inFence = true;
          fenceLang = fenceMatch[1] || '';
        }
        continue;
      }
      if (inFence) {
        fenceLines.push(line);
        continue;
      }

      if (line.includes('|')) {
        const nextLine = lines[i + 1];
        if (!inTable && nextLine && isTableSeparator(nextLine)) {
          closeList();
          inTable = true;
          tableHeader = parseTableCells(line);
          tableAligns = parseAligns(nextLine);
          tableRows = [];
          i++;
          continue;
        }
        if (inTable) {
          if (isTableSeparator(line)) continue;
          tableRows.push(parseTableCells(line));
          continue;
        }
      } else if (inTable) {
        closeTable();
      }

      const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
      const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
      if (unordered || ordered) {
        closeTable();
        const nextType = unordered ? 'ul' : 'ol';
        if (listType !== nextType) {
          closeList();
          listType = nextType;
          out.push(`<${listType}>`);
        }
        let itemText = (unordered || ordered)[1];
        const taskMatch = itemText.match(/^\[([ xX])\]\s*(.*)$/);
        if (taskMatch) {
          const checked = taskMatch[1].toLowerCase() === 'x' ? ' checked' : '';
          itemText = `<input type="checkbox" disabled${checked} /> ${taskMatch[2]}`;
        }
        out.push(`<li>${renderInline(itemText)}</li>`);
        continue;
      }
      closeList();

      if (!line.trim()) {
        closeTable();
        out.push('<div class="md-gap"></div>');
        continue;
      }

      if (/^\s*([-*_]\s*){3,}$/.test(line)) {
        closeTable();
        out.push('<hr />');
        continue;
      }

      const heading = line.match(/^(#{1,6})\s+(.+)$/);
      if (heading) {
        closeTable();
        const level = heading[1].length;
        out.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
        continue;
      }

      const quote = line.match(/^\s*>\s?(.*)$/);
      if (quote) {
        closeTable();
        out.push(`<blockquote>${renderInline(quote[1])}</blockquote>`);
        continue;
      }

      if (/^\s*<(\/?(?:section|article|div|table|thead|tbody|tr|th|td|p|ul|ol|li|blockquote|pre|details|summary|h[1-6]|figure|figcaption|svg|canvas|video|audio|form|header|footer|nav|main|aside))\b/i.test(line)) {
        closeTable();
        out.push(line);
        continue;
      }

      out.push(`<p>${renderInline(line)}</p>`);
    }

    closeList();
    closeTable();
    if (inFence) closeFence();
    return out.join('\n');
  }

  function renderInline(text) {
    if (!text) return '';
    const codeTokens = [];
    let s = text.replace(/`([^`\n]+)`/g, (_, code) => {
      const idx = codeTokens.length;
      codeTokens.push(`<code>${escapeHtml(code)}</code>`);
      return `@@INLINECODE${idx}@@`;
    });

    const htmlTokens = [];
    s = s.replace(/<\/?[A-Za-z][^>]*>/g, (tag) => {
      const idx = htmlTokens.length;
      htmlTokens.push(tag);
      return `@@INLINEHTML${idx}@@`;
    });

    s = escapeHtml(s);

    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, (_, alt, url, title) => {
      const t = title ? ` title="${title}"` : '';
      return `<img src="${url}" alt="${alt}"${t} loading="lazy" />`;
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, (_, label, url, title) => {
      const t = title ? ` title="${title}"` : '';
      return `<a href="${url}" target="_blank" rel="noopener noreferrer"${t}>${label}</a>`;
    });
    s = s.replace(/(\*\*|__)([^*_\n]+)\1/g, '<strong>$2</strong>');
    s = s.replace(/(\*|_)([^*_\n]+)\1/g, '<em>$2</em>');
    s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

    s = s.replace(/@@INLINEHTML(\d+)@@/g, (_, idx) => htmlTokens[Number(idx)] || '');
    s = s.replace(/@@INLINECODE(\d+)@@/g, (_, idx) => codeTokens[Number(idx)] || '');

    return s;
  }

  function renderAttachments(target) {
    if (!target) return;
    target.replaceChildren();
    attachments.forEach((attachment, index) => {
      const item = el('div', 'attachment');
      const preview = document.createElement('img');
      preview.src = attachment.data;
      preview.alt = '';
      const name = el('span', 'attachment-name', attachment.name || 'image');
      const remove = el('button', 'attachment-remove', '×');
      remove.type = 'button';
      remove.title = `Remove ${attachment.name || 'image'}`;
      remove.addEventListener('click', () => {
        attachments.splice(index, 1);
        renderAttachments(target);
        const submit = document.getElementById('submit-button');
        const input = document.getElementById('response-input');
        if (submit && request?.kind !== 'approval' && !request?.presentationOnly) {
          submit.disabled = selected.size === 0 && !(input?.value.trim()) && attachments.length === 0;
        }
        reportHeight();
      });
      item.append(preview, name, remove);
      target.append(item);
    });
    reportHeight();
  }

  function actionButton(label, variant, handler) {
    const button = el('button', `button${variant ? ` ${variant}` : ''}`, label);
    button.type = 'button';
    button.addEventListener('click', handler);
    return button;
  }

  function submitOption(option) {
    selected.clear();
    selected.add(option);
    const input = document.getElementById('response-input');
    if (input) input.value = '';
    submit(false);
  }

  function submit(skip) {
    if (!request) return;
    const input = document.getElementById('response-input');
    const custom = input?.value.trim() || '';
    const values = [...selected];
    if (!request.presentationOnly && !request.contentOnly && !skip && !custom && values.length === 0 && attachments.length === 0) {
      const error = document.getElementById('error');
      error.textContent = 'Choose an option, write a response, or attach an image.';
      error.hidden = false;
      return;
    }

    const optionIndexes = values.map((value) => (request.options || []).indexOf(value)).filter((index) => index >= 0);
    const answer = request.presentationOnly
      ? 'Continue'
      : skip
        ? 'Skipped'
        : custom || values[0] || (attachments.length ? 'Attached image' : request.contentOnly ? 'Continue' : '');
    native('submit', {
      requestId: request.requestId,
      answer,
      answers: request.multiple ? [...values, ...(custom ? [custom] : [])] : [answer],
      custom: skip || Boolean(custom) || (values.length === 0 && attachments.length > 0),
      optionIndex: !request.multiple && optionIndexes.length === 1 ? optionIndexes[0] : null,
      optionIndexes: optionIndexes.length ? optionIndexes : null,
      attachments,
      skip,
      presentationOnly: Boolean(request.presentationOnly),
      contentOnly: Boolean(request.contentOnly),
    });
    disableAll();
  }

  function disableAll() {
    for (const control of document.querySelectorAll('button, textarea')) control.disabled = true;
  }

  function autosize(input) {
    input.style.height = '35px';
    input.style.height = `${Math.min(130, Math.max(35, input.scrollHeight))}px`;
    reportHeight();
  }

  async function prepareImage(file) {
    if (!file?.type?.startsWith('image/')) throw new Error('Choose an image file.');
    const source = await decodeImage(file);
    try {
      const sourceWidth = Number(source.width || source.naturalWidth || 0);
      const sourceHeight = Number(source.height || source.naturalHeight || 0);
      if (!sourceWidth || !sourceHeight) throw new Error('Could not decode the image.');
      const maxDimension = 1600;
      const scale = Math.min(1, maxDimension / Math.max(sourceWidth, sourceHeight));
      let width = Math.max(1, Math.round(sourceWidth * scale));
      let height = Math.max(1, Math.round(sourceHeight * scale));
      let quality = 0.84;
      let blob = null;
      for (let attempt = 0; attempt < 5; attempt += 1) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d', { alpha: false });
        if (!context) throw new Error('Image preparation is unavailable.');
        context.drawImage(source, 0, 0, width, height);
        blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/webp', quality));
        if (!blob) throw new Error('Could not prepare the image.');
        if (blob.size <= 1_100_000) break;
        width = Math.max(320, Math.round(width * 0.8));
        height = Math.max(320, Math.round(height * 0.8));
        quality = Math.max(0.58, quality - 0.08);
      }
      if (!blob || blob.size > 1_250_000) throw new Error('The image is too large to attach.');
      return {
        name: `${String(file.name || 'image').replace(/\.[^.]+$/, '') || 'image'}.webp`,
        mimeType: 'image/webp',
        data: await blobToDataUrl(blob),
        bytes: blob.size,
      };
    } finally {
      source.close?.();
      if (source.__objectUrl) URL.revokeObjectURL(source.__objectUrl);
    }
  }

  async function decodeImage(file) {
    if (typeof createImageBitmap === 'function') return createImageBitmap(file);
    return new Promise((resolve, reject) => {
      const image = new Image();
      const url = URL.createObjectURL(file);
      image.__objectUrl = url;
      image.onload = () => resolve(image);
      image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not decode the image.')); };
      image.src = url;
    });
  }

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(reader.error || new Error('Could not read the image.'));
      reader.readAsDataURL(blob);
    });
  }

  function dataUrlToBlob(value) {
    const match = String(value || '').match(/^data:([^;,]+);base64,(.*)$/s);
    if (!match) throw new Error('Invalid image data.');
    const binary = atob(match[2]);
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
    return new Blob([bytes], { type: match[1] || 'image/png' });
  }

  function copyText() {
    if (!request) return '';
    const pieces = [];
    if (request.kind === 'approval' && request.prompt) pieces.push(request.prompt); else if (request.question) pieces.push(request.question);
    for (const section of request.sections || []) if (section?.text) pieces.push(`${section.label || 'Details'}\n${section.text}`);
    return pieces.join('\n\n');
  }

  function startCountdown(element, expiresAt) {
    if (countdown) clearInterval(countdown);
    const update = () => {
      const remaining = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
      element.textContent = `${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2, '0')} left`;
      element.dataset.urgency = remaining <= 30 ? 'critical' : remaining <= 120 ? 'warning' : '';
      if (remaining === 0 && countdown) { clearInterval(countdown); countdown = 0; }
    };
    update();
    countdown = setInterval(update, 1000);
  }

  function escapeHtml(value) {
    return String(value || '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function reportHeight() {
    requestAnimationFrame(() => native('resize', { height: Math.ceil(document.documentElement.scrollHeight) }));
  }

  new ResizeObserver(reportHeight).observe(document.body);
  window.__localSystemShow = (payload) => {
    request = payload && typeof payload === 'object' ? payload : null;
    compactMode = request?.compact !== false;
    if (countdown) { clearInterval(countdown); countdown = 0; }
    render();
  };
  window.__localSystemQueue = (count) => {
    if (!request) return;
    request.pendingCount = Math.max(1, Number(count) || 1);
    updatePendingBadges(request.pendingCount);
  };
  window.__localSystemExpand = () => {
    if (!request) return;
    compactMode = false;
    if (countdown) { clearInterval(countdown); countdown = 0; }
    render();
  };
  window.__localSystemWaiting = () => {
    request = null;
    compactMode = false;
    if (countdown) { clearInterval(countdown); countdown = 0; }
    render();
  };
  window.__localSystemShowError = (message) => {
    const error = document.getElementById('error');
    if (!error) return;
    error.textContent = String(message || 'Something went wrong.');
    error.hidden = false;
    reportHeight();
  };

  native('ready');
  reportHeight();
})();
</script>
</body>
</html>
