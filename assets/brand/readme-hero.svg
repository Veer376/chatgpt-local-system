<text x="54" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#D4FF52" >OPEN SOURCE   /   LOCAL-FIRST   /   11 MCP TOOLS</text>
<text x="50" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="68" font-weight="710" fill="#F2F5E9" letter-spacing="-3.5">Your computer.</text>
